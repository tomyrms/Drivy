[package]
name = "drivy-messaging-crypto-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Isolated test-only crate. No dependency from Drivy production packages.
[dev-dependencies]
matrix-sdk-crypto = { version = "=0.19.1", default-features = false }
ruma = { version = "=0.17.1", features = ["client-api-c", "events"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt"] }

