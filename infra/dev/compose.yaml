name: drivy-identity-dev
services:
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "100"
      MP_VERBOSE: "false"
    mem_limit: 128m
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: ["start-dev"]
    env_file: [".state/keycloak.env"]
    environment:
      KC_HOSTNAME: "http://127.0.0.1:8081"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: "warn"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    mem_limit: 1g
volumes:
  keycloak-data:
