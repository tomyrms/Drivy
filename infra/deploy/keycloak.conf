# Valeurs non secrètes ; mot de passe DB dans EnvironmentFile root uniquement.
db=postgres
db-url=jdbc:postgresql://drivy-db.tailb60275.ts.net:5432/drivy_identity?sslmode=verify-full&sslrootcert=/etc/drivy-refonte/db-ca.crt
