# Thème de connexion Drivy : hérite de keycloak.v2 (Keycloak 26.7) et n'ajoute qu'une feuille de style
# et des libellés. Aucun gabarit n'est remplacé, pour suivre les mises à jour de Keycloak sans retouche.
# Cloudflare garde /identity/resources/* 30 jours sous le même chemin : renommer la feuille Drivy
# (drivy-N.css) à chaque modification, sinon l'ancienne version reste servie.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/drivy-2.css
darkMode=true
