name: Refonte · iOS
on:
  push:
    branches: [master, codex/refonte-g0]
    paths:
      - 'apps/ios/**'
      - 'scripts/ios/**'
      - '.github/workflows/refonte-ios.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/ios/**'
      - 'scripts/ios/**'
      - '.github/workflows/refonte-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refonte-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple:
    name: Tests natifs et IPA
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer XcodeGen vérifié
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          chmod +x "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Générer le projet et relever l'environnement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          xcodebuild -version | tee artifacts/ios/xcode.txt
          xcodebuild -showsdks > artifacts/ios/sdks.txt
          sw_vers > artifacts/ios/macos.txt
          swift --version > artifacts/ios/swift.txt
          xcodegen generate --spec apps/ios/project.yml
          mkdir -p apps/ios/Drivy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp apps/ios/Package.resolved apps/ios/Drivy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project apps/ios/Drivy.xcodeproj -scheme Drivy
          cp apps/ios/Drivy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved artifacts/ios/Package.resolved
      - name: Compiler l'application et les tests natifs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project apps/ios/Drivy.xcodeproj -scheme Drivy \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath artifacts/ios/DerivedData \
            2>&1 | tee artifacts/ios/simulator-build.log
          python3 - <<'PY'
          import pathlib, plistlib, shutil
          root = pathlib.Path('artifacts/ios/DerivedData/Build/Intermediates.noindex/Drivy.build')
          matches = list(root.rglob('Drivy.app-Simulated.xcent'))
          if len(matches) != 1:
              raise SystemExit('Entitlements du simulateur introuvables ou ambigus.')
          entitlements = plistlib.loads(matches[0].read_bytes())
          if entitlements.get('application-identifier') != 'ch.drivy.qualification' or 'ch.drivy.qualification' not in entitlements.get('keychain-access-groups', []):
              raise SystemExit('Accès au trousseau absent des entitlements du simulateur.')
          shutil.copyfile(matches[0], 'artifacts/ios/simulator-entitlements.plist')
          PY
      - name: Tests natifs et parcours iPhone puis iPad
        shell: bash
        run: bash scripts/ios/test-simulator.sh
      - name: Construire l'IPA pour iLoader
        shell: bash
        run: bash scripts/ios/build-ipa.sh
      - name: Artefact IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Drivy-unsigned-${{ github.sha }}
          path: |
            artifacts/ios/Drivy.ipa
            artifacts/ios/SHA256SUMS.txt
            artifacts/ios/build-info.json
            artifacts/ios/Package.resolved
            artifacts/ios/xcode.txt
            artifacts/ios/sdks.txt
            artifacts/ios/macos.txt
            artifacts/ios/swift.txt
          if-no-files-found: error
          retention-days: 14
      - name: Exporter les résultats et captures des tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for result in artifacts/ios/*.xcresult; do
            [[ -d "$result" ]] || continue
            name=$(basename "$result" .xcresult)
            mkdir -p "artifacts/ios/test-reports/$name"
            xcrun xcresulttool get test-results summary --path "$result" > "artifacts/ios/test-reports/$name/summary.json"
            xcrun xcresulttool export attachments --path "$result" --output-path "artifacts/ios/test-reports/$name/attachments"
          done
      - name: Résultats natifs et captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Drivy-native-results-${{ github.sha }}
          path: |
            artifacts/ios/*.xcresult
            artifacts/ios/test-reports/
            artifacts/ios/*.png
            artifacts/ios/*-build.log
            artifacts/ios/*-test.log
            artifacts/ios/Package.resolved
            artifacts/ios/xcode.txt
            artifacts/ios/sdks.txt
            artifacts/ios/macos.txt
            artifacts/ios/swift.txt
            artifacts/ios/simulator-entitlements.plist
          if-no-files-found: warn
          retention-days: 14
