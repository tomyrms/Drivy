name: Refonte · ouverture école navigateur
on:
  workflow_call:
    inputs:
      qualification_sha:
        required: true
        type: string
      extended_suites:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      extended_suites:
        description: 'Suites étendues séparées par des virgules (formations, code, recovery) ; vide pour le parcours de base'
        type: string
        default: ''
  push:
    branches: [master, 'codex/**', 'claude/**']
    paths: ['apps/api/**', 'apps/web/**', 'scripts/dev/check-school-*.ts', 'infra/dev/**', 'infra/identity/**', 'infra/deploy/runtime-lock.json', '.github/workflows/school-opening-e2e.yml']
  pull_request:
    branches: [master]
    paths: ['apps/api/**', 'apps/web/**', 'scripts/dev/check-school-*.ts', 'infra/dev/**', 'infra/identity/**', 'infra/deploy/runtime-lock.json', '.github/workflows/school-opening-e2e.yml']
permissions:
  contents: read
concurrency:
  group: school-opening-e2e-${{ inputs.qualification_sha || github.ref }}
  # Seul un push ou une pull request dépassés sont annulés (jamais master, un lancement explicite ou une qualification).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref != 'refs/heads/master' }}
jobs:
  browser:
    name: Chromium · OIDC · BFF · API · PostgreSQL
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mailpit:
        image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports: [1025:1025, 8025:8025]
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: drivy_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: drivy_onboarding_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U drivy_test -d drivy_onboarding_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
      ONBOARDING_E2E_DATABASE_URL: postgres://drivy_test:test-only@127.0.0.1:5432/drivy_onboarding_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.qualification_sha || github.sha }}
      - run: bash scripts/qualification/verify-checkout.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            infra/dev/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web --ignore-scripts
      - run: npm ci --prefix infra/dev --ignore-scripts
      - name: Choisir le JDK 21 du runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          test -x "$JAVA_HOME_21_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/javac" -version
      - run: node infra/dev/node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run build --prefix apps/web
      - name: Parcours complet sur données synthétiques
        env:
          EXTENDED_SUITES: ${{ inputs.extended_suites }}
        run: npx tsx scripts/dev/check-school-opening.ts ${EXTENDED_SUITES:+--extended=$EXTENDED_SUITES}
      - name: Vérifier les contrôles navigateur exécutés
        if: always()
        run: python3 scripts/qualification/evidence.py browser artifacts/onboarding-web-synthetic/result.json
      # Seulement les captures d'écrans métier sans lien secret et le bilan de contrôles.
      # Aucun journal réseau, cookie, trace Playwright, realm OIDC ou mot de passe n'est archivé.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: onboarding-web-synthetic-${{ inputs.qualification_sha || github.sha }}
          path: |
            artifacts/onboarding-web-synthetic/
            artifacts/qualification/identity.json
          if-no-files-found: error
          retention-days: 7
