name: Refonte · vérifications
on:
  workflow_dispatch:
    inputs:
      final_campaign:
        description: Lancer la qualification finale complète via cette entrée déjà enregistrée
        type: boolean
        default: false
      messaging_qualification:
        description: Accès Messages physique dans les tests et l'IPA de la campagne finale
        type: boolean
        default: false
      candidate_ref:
        description: Référence du candidat final, vide pour le SHA du déclenchement
        type: string
        default: ''
  push:
    branches: [master, 'codex/**', 'claude/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  # Un push ou une pull request dépassé par un plus récent sur la même référence ne sert plus à rien, master compris :
  # le dernier commit de la rafale porte tout le contenu des précédents. Un lancement manuel a son propre groupe
  # (jamais annulé par un push) et la campagne finale reste sérialisée sans annulation.
  group: refonte-checks-entry-${{ github.ref }}-${{ inputs.final_campaign && 'final' || github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.final_campaign != true
    uses: ./.github/workflows/qualification-checks.yml
    with:
      qualification_sha: ${{ github.sha }}
      # Push et pull request : seulement les suites que touchent les fichiers modifiés. Un lancement manuel les exécute toutes.
      select_by_paths: ${{ github.event_name != 'workflow_dispatch' }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
  final:
    if: github.event_name == 'workflow_dispatch' && inputs.final_campaign == true
    uses: ./.github/workflows/validation-finale.yml
    with:
      candidate_ref: ${{ inputs.candidate_ref || github.sha }}
      messaging_qualification: ${{ inputs.messaging_qualification }}
