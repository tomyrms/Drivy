name: Refonte · vérifications
on:
  workflow_call:
    inputs:
      qualification_sha:
        required: true
        type: string
  workflow_dispatch:
  push:
    branches: [master, 'codex/**', 'claude/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: refonte-checks-${{ inputs.qualification_sha || github.ref }}
  cancel-in-progress: false
jobs:
  server:
    name: Contrats, droits et PostgreSQL
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mailpit:
        image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports: [1025:1025, 8025:8025]
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: drivy_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: drivy_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U drivy_test -d drivy_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
      TEST_DATABASE_URL: postgres://drivy_test:test-only@127.0.0.1:5432/drivy_test
      WEB_COMMAND_TEST_DATABASE_URL: postgres://drivy_test:test-only@127.0.0.1:5432/drivy_web_test
      TEST_SMTP_PORT: '1025'
      TEST_MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.qualification_sha || github.sha }}
      - run: bash scripts/qualification/verify-checkout.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # PostgreSQL réel à chaque push : aucune modification du serveur sans son filet de tests.
      - run: npm test --workspace @drivy/api -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/api-results.json"
      - name: Vérifier les tests API exécutés
        if: always()
        run: python3 scripts/qualification/evidence.py vitest "$RUNNER_TEMP/api-results.json" --output artifacts/qualification/api.json
      - run: npm run build
      - name: Preuves API synthétiques
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-results-${{ inputs.qualification_sha || github.sha }}
          path: artifacts/qualification/
          if-no-files-found: error
          retention-days: 14
  web:
    name: Web et BFF
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.qualification_sha || github.sha }}
      - run: bash scripts/qualification/verify-checkout.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web --ignore-scripts
      - run: npm run typecheck --prefix apps/web
      - run: npm test --prefix apps/web -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/web-results.json"
      - name: Vérifier les tests web exécutés
        if: always()
        run: python3 scripts/qualification/evidence.py vitest "$RUNNER_TEMP/web-results.json" --output artifacts/qualification/web.json
      - run: npm run build --prefix apps/web
      - name: Preuves web synthétiques
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-results-${{ inputs.qualification_sha || github.sha }}
          path: artifacts/qualification/
          if-no-files-found: error
          retention-days: 14
  documentation:
    name: Intégrité et contrats documentaires
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.qualification_sha || github.sha }}
      - run: bash scripts/qualification/verify-checkout.sh
        env:
          QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Drivy_Conception_v3_17_2026-09-20/requirements.txt
      - run: python -B Drivy_Conception_v3_17_2026-09-20/annexes/verifier-integrite.py
      - run: pip install -r Drivy_Conception_v3_17_2026-09-20/requirements.txt
      - run: python -B Drivy_Conception_v3_17_2026-09-20/annexes/verifier-documentation.py
