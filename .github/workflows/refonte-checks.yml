name: Refonte · vérifications
on:
  workflow_dispatch:
    inputs:
      final_campaign:
        description: Lancer la qualification finale complète via cette entrée déjà enregistrée
        type: boolean
        default: false
      candidate_ref:
        description: Référence du candidat final, vide pour le SHA du déclenchement
        type: string
        default: ''
  push:
    branches: [master, 'codex/**', 'claude/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: refonte-checks-entry-${{ github.ref }}-${{ inputs.final_campaign && 'final' || 'checks' }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.final_campaign != true
    uses: ./.github/workflows/qualification-checks.yml
    with:
      qualification_sha: ${{ github.sha }}
  final:
    if: github.event_name == 'workflow_dispatch' && inputs.final_campaign == true
    uses: ./.github/workflows/validation-finale.yml
    with:
      candidate_ref: ${{ inputs.candidate_ref || github.sha }}
