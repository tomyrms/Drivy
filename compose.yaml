name: drivy-refonte
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: drivy_dev
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: drivy_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - drivy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivy_dev -d drivy_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  drivy-postgres:
