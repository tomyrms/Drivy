*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pagebg)}
body{font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.stage{display:inline-block;padding:14px}
.num{font-variant-numeric:tabular-nums}
.phone{position:relative;overflow:hidden;background:var(--canvas);box-shadow:0 0 0 1px var(--frame);flex:none}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0 54px;font-weight:600;font-size:16px;z-index:8}
.status .ic{display:flex;gap:6px;align-items:center}
.float{position:absolute;background:var(--surface);box-shadow:var(--shadow)}
.tabbar{left:21px;right:21px;bottom:21px;height:60px;border-radius:30px;display:flex;align-items:center;padding:0 4px;z-index:6}
.tab{flex:1;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:var(--text)}
.tab svg{width:26px;height:24px;fill:currentColor}
.tab.on{background:var(--sm);color:var(--accent);font-weight:600}
.btn{border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--on)}
.btn.sec{background:var(--sm);color:var(--accent)}
.link{color:var(--accent);font-weight:600}
.m{color:var(--muted)}
.chev{width:8px;height:14px;flex:none}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);z-index:9}
/* texte */
.h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:17px;line-height:22px;font-weight:600}
.body{font-size:17px;line-height:22px}
.sm15{font-size:15px;line-height:20px}
/* bilan */
.navrow{position:absolute;left:16px;right:16px;top:58px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:7}
.navrow .pill{height:44px;border-radius:22px;background:var(--surface);box-shadow:0 2px 12px rgba(16,21,28,.10),0 0 0 .5px var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;gap:14px;padding:0 16px}
.navrow .t{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--sm);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex:none}
.mrow{display:grid;grid-template-columns:52px 36px 1fr;align-items:center;min-height:64px}
.mt{text-align:right;padding-right:6px;font-size:15px;font-weight:600}
.mr{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.mr::before{content:"";position:absolute;left:50%;width:3px;margin-left:-1.5px;top:0;bottom:0;background:var(--text)}
.mrow.first .mr::before{top:50%;border-radius:2px 2px 0 0}
.mrow.last .mr::before{bottom:50%;border-radius:0 0 2px 2px}
.mr svg{position:relative}
.mc{padding-left:6px}
.ml{font-size:17px;line-height:22px}
.ms{font-size:14px;line-height:18px;color:var(--muted)}
.mapcard{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 0 0 .5px var(--border)}
.mapcard svg.map{display:block;width:100%;height:auto}
.play{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:22px;background:var(--surface);box-shadow:0 2px 10px rgba(16,21,28,.18),0 0 0 .5px var(--border);display:flex;align-items:center;justify-content:center}
.crow{display:flex;align-items:center}
.crow .cn{flex:1;min-width:0}
.cname{font-size:17px;line-height:22px;font-weight:600}
.clev{font-size:14.5px;line-height:19px;color:var(--muted);margin-top:1px}
.crow svg.p{margin-right:12px;flex:none}
