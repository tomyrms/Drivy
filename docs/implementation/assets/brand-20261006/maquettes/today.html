html,body{background:transparent}
body{font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.phone{width:393px;height:852px;position:relative;overflow:hidden;border-radius:44px;background:var(--canvas);color:var(--text)}
.phone::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--ring);z-index:30;pointer-events:none}

.status .ic{position:absolute;right:30px;top:21px}
.ipad .status{height:40px;font-size:14.5px}
.ipad .status .t{left:30px;top:12px;line-height:20px}
.ipad .status .ic{right:24px;top:14px}
.float{position:absolute;background:var(--surface);box-shadow:var(--shadow)}
.tabbar{left:21px;right:21px;bottom:21px;height:60px;border-radius:30px;display:flex;align-items:center;padding:0 4px;z-index:6}
.tab{flex:1;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:var(--text)}
.tab svg{width:26px;height:24px;fill:currentColor}
.tab.on{background:var(--sm);color:var(--accent);font-weight:600}
.btn{border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--onAccent)}
.btn.sec{background:var(--sm);color:var(--accent)}
.chev{width:8px;height:14px;flex:none;color:var(--muted)}
.m{color:var(--muted)}
.link{color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:var(--warnBg);color:var(--warn);font-size:13px;font-weight:600;white-space:nowrap}
.seg{height:34px;border-radius:17px;background:var(--sm);display:flex;padding:2px;font-size:14px;font-weight:500}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;border-radius:15px}
.seg .on{background:var(--selBg);box-shadow:0 0 0 .5px var(--border);font-weight:600}
.round{width:43px;height:43px;border-radius:22px;background:var(--sm);display:flex;align-items:center;justify-content:center}
.mbg{fill:var(--mapBg)}.mb{fill:var(--mapBlock)}.mr{fill:none;stroke:var(--mapRoad);stroke-linecap:round;stroke-linejoin:round}.ml{fill:var(--mapLabel);font-weight:500;letter-spacing:.6px}
.strip{position:absolute;border-radius:24px;background:var(--canvas);box-shadow:inset 0 0 0 .5px var(--border);display:flex}
.phone.dark .strip{background:var(--sm)}
.strip .d{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.strip .d .l{font-size:13px;font-weight:600;color:var(--muted);line-height:16px}
.strip .d .n{font-size:22px;line-height:28px;margin-top:5px}
.strip .d .dots{display:flex;gap:4px;margin-top:5px}
.strip .d .dots i{width:5px;height:5px;border-radius:3px;background:var(--muted)}
.strip .d.sel .pav{position:absolute;inset:4px 2px;border-radius:17px;background:var(--accent)}
.strip .d.sel>*:not(.pav){position:relative;color:var(--onAccent)}
.strip .d.sel .dots i{background:var(--onAccent)}
.strip .d.sel .n{font-weight:600}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--toggle);position:relative}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(16,21,28,.25)}
